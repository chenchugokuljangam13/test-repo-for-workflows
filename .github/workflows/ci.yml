name: ci.yml

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      - name: Install dependencies
        run: npm i

      - name: Install Supabase JS client
        run: npm install @supabase/supabase-js

      - name: Make fetch script executable
        run: chmod +x scripts/download_hidden_test_and_run.sh

      # - name: Download hidden test file
      #   env:
      #     SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      #     SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      #     REPO_NAME: ${{ github.event.repository.name }}
      #   run: ./scripts/download_hidden_test_and_run.sh

      - name: Run unit tests with Jest
        continue-on-error: true
        env:
          SESSION_SECRET: notsecure
        run: |
          npx cross-env SESSION_SECRET=notsecure jest \
            --ci --forceExit --json --outputFile=results.json > /dev/null 2>&1


      - name: Show Test Summary (Passed/Failed/Total)
        run: |
          echo "Test Summary:"
          if [ -f results.json ]; then
            cat ./results.json | jq '{
              passed: .numPassedTests,
              failed: .numFailedTests,
              total: .numTotalTests
            }'
          else
            echo "results.json not found - Jest may have failed to run"
            echo '{"passed": 0, "failed": 0, "total": 0}'
          fi
      - name: Make script executable
        run: chmod +x scripts/update-results.sh
      - name: Upload results to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_KEY }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: scripts/update-results.sh
